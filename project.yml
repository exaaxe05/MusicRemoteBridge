
name: MusicRemoteBridge

options:
  bundleIdPrefix: com.musicremote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MusicRemoteBridge:
    type: application
    platform: iOS
    sources:
      - path: Sources/MusicRemoteBridge
    info:
      path: Resources-Info.plist
    entitlements:
      path: MusicRemoteBridge.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musicremote.bridge
        PRODUCT_NAME: MusicRemoteBridge
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
